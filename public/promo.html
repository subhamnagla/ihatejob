<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ihatejob promo reel</title>

<!-- Not a page for visitors. It is a 9:16 sequence to point a screen recorder
     at: press play, record the window, and you have a reel.

     Everything it shows is produced by the site's own code - the CV is
     renderCV(), the score and the findings are reviewCV() run live on the
     document you are watching. Nothing here is a mockup, which means it
     cannot drift from what the product actually does, and the "before" CV is
     weak in the way real first drafts are weak rather than in a way chosen to
     make the numbers look good. -->

<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/cv.css">

<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; height: 100%;
    background: #05070a;
    overflow: hidden;
    font-family: 'Public Sans', ui-sans-serif, system-ui, sans-serif;
  }

  /* The stage is always 1080x1920. It is scaled to whatever window you record,
     so the composition is identical at every capture size. */
  #fit { position: fixed; inset: 0; overflow: hidden; }
  #stage {
    width: 1080px; height: 1920px;
    position: absolute; left: 50%; top: 50%;
    transform-origin: 50% 50%;
    overflow: hidden;
    background:
      radial-gradient(120% 60% at 50% 0%, #142033 0%, transparent 60%),
      linear-gradient(180deg, #0a0f18, #05070a);
    color: #e7edf5;
  }

  .scene {
    position: absolute; inset: 0;
    padding: 110px 80px;
    display: flex; flex-direction: column;
    opacity: 0; visibility: hidden;
    transition: opacity .5s ease, visibility .5s;
  }
  .scene.on { opacity: 1; visibility: visible; }

  .kicker { font-size: 34px; font-weight: 600; color: #7fb0ff; letter-spacing: .01em; }
  h1 { font-size: 104px; line-height: 1.04; margin: 26px 0 0; font-weight: 700; letter-spacing: -.03em; }
  h1 .q { color: #7fb0ff; }
  .sub { font-size: 40px; line-height: 1.45; color: #9fb0c4; margin: 34px 0 0; max-width: 20em; }

  /* the paper */
  .sheet { margin: 70px auto 0; width: 820px; border-radius: 10px; overflow: hidden;
           box-shadow: 0 50px 120px rgba(0,0,0,.65); background: #fff; }
  .sheet .page { zoom: 1.033; }           /* 794 -> 820 */

  /* the verdict card */
  .verdict {
    margin-top: 64px; border-radius: 28px; padding: 54px 56px;
    background: linear-gradient(180deg, rgba(127,176,255,.10), rgba(127,176,255,.03));
    border: 1px solid rgba(127,176,255,.22);
  }
  .score { display: flex; align-items: baseline; gap: 22px; }
  .score b { font-size: 150px; line-height: 1; font-weight: 700; font-variant-numeric: tabular-nums; }
  .score i { font-style: normal; font-size: 44px; color: #9fb0c4; }
  .grade { margin-left: auto; font-size: 46px; font-weight: 600; }

  /* minmax(0,1fr), not 1fr: a bare 1fr keeps an automatic minimum the size of
     its longest word, so "Machine-readability" pushed the three columns out to
     932px inside an 808px box and the last one ran off the stage. */
  .bands { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
           gap: 20px; margin-top: 44px; }
  .band { border-radius: 16px; padding: 22px 24px; background: rgba(255,255,255,.05); }
  .band span { display: block; font-size: 26px; color: #9fb0c4; }
  .band b { font-size: 44px; font-weight: 700; }
  .band.low b { color: #ff8a8a; }
  .band.good b { color: #6fe0a6; }

  .finding {
    margin-top: 40px; border-radius: 20px; padding: 34px 38px;
    background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.10);
  }
  .finding b { display: block; font-size: 36px; margin-bottom: 14px; }
  .finding q { display: block; font-size: 34px; line-height: 1.5; color: #ffd9d9;
               font-style: italic; quotes: '\201C' '\201D'; }

  .chips { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 44px; }
  .chip { font-size: 30px; padding: 13px 22px; border-radius: 999px;
          background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.10); }

  .rail { display: flex; gap: 30px; margin-top: 70px; }
  /* 287px of column / 794px of A4 = 0.361, so the page fills the frame's width
     exactly; 1123 * 0.361 = 406 is therefore how tall the frame can be before
     it is holding white space rather than paper. It was 700. */
  .rail .frame { flex: 1; border-radius: 12px; overflow: hidden; background: #fff;
                 box-shadow: 0 30px 70px rgba(0,0,0,.6); height: 406px; }
  .rail .page { zoom: .361; }
  .rail em { display: block; font-style: normal; font-size: 26px; color: #9fb0c4;
             margin-top: 16px; text-align: center; }

  .feats { margin-top: 60px; display: grid; gap: 26px; }
  .feats li { list-style: none; font-size: 40px; padding-left: 28px;
              border-left: 4px solid #7fb0ff; line-height: 1.3; }

  .wordmark { margin-top: auto; }
  .wordmark b { display: block; font-size: 88px; font-weight: 700; letter-spacing: -.02em; }
  .wordmark span { display: block; margin-top: 18px; font-size: 38px; color: #9fb0c4; }

  /* Burned into the frame on purpose: most of this will be watched with the
     sound off, and a reel whose argument is only in the audio has no argument
     for most of the people who see it. */
  #cap {
    position: absolute; left: 64px; right: 64px; bottom: 74px;
    min-height: 132px;
    display: flex; align-items: flex-end; justify-content: center;
    text-align: center;
    font-size: 40px; line-height: 1.32; font-weight: 600;
    color: #f2f6fb;
    text-shadow: 0 2px 14px rgba(0, 0, 0, .85), 0 0 40px rgba(0, 0, 0, .6);
    pointer-events: none;
  }
  #cap span { display: inline-block; max-width: 17em; }

  /* press to play, so the recorder can be started on a still frame */
  #go {
    position: fixed; inset: 0; z-index: 9; display: grid; place-items: center;
    background: rgba(5,7,10,.86); border: 0; color: #e7edf5; cursor: pointer;
    font: 600 22px/1.5 'Public Sans', system-ui, sans-serif;
  }
  #go div { text-align: center; max-width: 30em; }
  #go small { display: block; margin-top: 12px; color: #9fb0c4; font-weight: 400; }
  #go[hidden] { display: none; }

  @media (prefers-reduced-motion: reduce) {
    .scene { transition: none; }
  }
</style>

<div id="fit"><div id="stage"></div></div>

<!-- Not autoplay: a browser will not start audio without a gesture, which is
     what the play button is for. preload so the first word is not late. -->
<audio id="vo" src="/media/promo-vo.wav" preload="auto"></audio>

<button id="go" type="button"><div>
  Press to play
  <small>33 seconds, 9:16, with voiceover and burned-in captions.
  Start your screen recorder first, then press this &mdash; it goes fullscreen
  so the address bar stays out of the shot.
  ?auto=1 starts without a press, for a capture tool; it plays silently if the
  browser refuses to start audio on its own.</small>
</div></button>

<script type="module">
import { buildSample } from '/js/samples.js';
import { renderCV } from '/js/templates.js';
import { reviewCV } from '/js/review.js';
import { PROFESSIONS, REGIONS } from '/js/professions.js';

/* ---------------------------------------------------------------- data */

// The "after" CV is the sample exactly as the site ships it. The "before" is
// the same CV with its numbers taken out and its bullets rewritten as duties,
// which is how most first drafts actually read. Both are scored live below,
// so the figures on screen are whatever the real reviewer says today.
const after = buildSample('software-engineering');
after.basics.fullName = 'Subham Nagla';
after.basics.email = 'subham.nagla@example.com';
after.settings.accent = '#057d74';

const before = structuredClone(after);
before.basics.summary = 'Hardworking and passionate engineer, responsible for delivering '
  + 'high quality solutions in a fast paced environment. Team player with excellent '
  + 'communication skills.';
before.basics.website = '';
before.basics.linkedin = '';
before.projects = [];
before.experience[0].bullets = ['Responsible for the checkout flow.',
  'Worked on a component library.', 'Helped with testing.'];
before.experience[1].bullets = ['Assisted with the merchant dashboard.',
  'Involved in build tooling.'];

const rBefore = reviewCV(before);
const rAfter = reviewCV(after);

const nProf = Object.keys(PROFESSIONS).length;
const nRegion = Object.keys(REGIONS).length;

const paper = (d) => { const { html, classes } = renderCV(d);
  return '<div class="' + classes + '" style="--accent:' + d.settings.accent + '">' + html + '</div>'; };

const fmt = (d, tpl, accent) => { const c = structuredClone(d);
  c.settings.template = tpl; c.settings.accent = accent; return paper(c); };

/* -------------------------------------------------------------- scenes */

const band = (b) => '<div class="band ' + (b.letter[0] === 'E' || b.letter[0] === 'D' ? 'low'
  : b.letter[0] === 'A' ? 'good' : '') + '"><span>' + b.name + '</span><b>' + b.letter + '</b></div>';

const worst = rBefore.findings[0];

const TRADES = ['Software engineering', 'Nursing', 'Teaching', 'Banking',
  'Skilled trades', 'Law', 'Pharmacy'];

const SCENES = [
  // The promise first: most people arrive not knowing that a CV has a
  // convention at all, let alone that it differs by field and by country.
  { ms: 4400, html: '<p class="kicker">Built to the standard of your field</p>'
    + '<h1>A CV written<br>the way your<br><span class="q">industry</span> writes one.</h1>'
    + '<p class="sub">' + nProf + ' professions and ' + nRegion + ' regions decide the section '
    + 'order, the page count, and what has to carry a number.</p>'
    + '<div class="chips">' + TRADES.map((t) => '<span class="chip">' + t + '</span>').join('')
    + '</div>' },

  { ms: 3600, html: '<p class="kicker">Before a recruiter sees it</p>'
    + '<h1>Your CV,<br>read by a <span class="q">machine</span><br>that tells you why.</h1>'
    + '<p class="sub">Not a template. A second reading of the document you already have.</p>' },

  { ms: 4800, html: '<p class="kicker">Start with the one you have</p>'
    + '<h1 style="font-size:72px">Drop in a PDF,<br>Word file, or<br>LinkedIn export.</h1>'
    + '<div class="sheet">' + paper(before) + '</div>' },

  { ms: 5600, html: '<p class="kicker">Six grades, not one number</p>'
    + '<div class="verdict"><div class="score"><b id="n">0</b><i>/ 100</i>'
    + '<span class="grade">' + rBefore.grade + ' &middot; ' + rBefore.letter + '</span></div>'
    + '<div class="bands">' + rBefore.bands.map(band).join('') + '</div></div>'
    + '<div class="finding"><b>' + worst.title + '</b><q>' + worst.detail + '</q></div>' },

  { ms: 5200, html: '<p class="kicker">Then it says what to change</p>'
    + '<div class="verdict"><div class="score"><b id="n2">' + rBefore.score + '</b><i>/ 100</i>'
    + '<span class="grade">' + rAfter.grade + ' &middot; ' + rAfter.letter + '</span></div>'
    + '<div class="bands">' + rAfter.bands.map(band).join('') + '</div></div>'
    + '<p class="sub">The same job. The same person. The numbers that were always true, '
    + 'put where a reader can find them.</p>' },

  { ms: 5000, html: '<p class="kicker">Eight formats, one press</p>'
    + '<div class="rail">'
    + '<div><div class="frame">' + fmt(after, 'classic', '#3465cc') + '</div><em>Classic</em></div>'
    + '<div><div class="frame">' + fmt(after, 'ats', '#111827') + '</div><em>ATS</em></div>'
    + '<div><div class="frame">' + fmt(after, 'modern', '#057d74') + '</div><em>Modern</em></div>'
    + '</div>'
    + '<ul class="feats"><li>Check it against a job advert</li>'
    + '<li>Fix your LinkedIn</li><li>Export PDF, Word or plain text</li></ul>' },

  { ms: 4800, html: '<p class="kicker">Open it and start</p>'
    + '<h1>It runs in<br>your browser.<br><span class="q">Nothing is<br>uploaded.</span></h1>'
    + '<div class="wordmark"><b>ihatejob.app</b>'
    + '<span>Free. No account. No paid tier.</span></div>' },
];

/* ------------------------------------------------------------ playback */

const stage = document.getElementById('stage');
stage.innerHTML = SCENES.map((s, i) =>
  '<section class="scene" data-i="' + i + '">' + s.html + '</section>').join('')
  + '<div id="cap"><span></span></div>';

const vo = document.getElementById('vo');
const capEl = document.querySelector('#cap span');

// The cue list is read from the .vtt rather than copied into this file, so the
// captions cannot disagree with the ones shipped alongside the audio.
const t2s = (t) => t.split(':').reverse()
  .reduce((n, part, i) => n + parseFloat(part.replace(',', '.')) * Math.pow(60, i), 0);
let CUES = [];
async function loadCues() {
  try {
    const text = await (await fetch('/media/promo-vo.vtt')).text();
    CUES = text.split(/\r?\n\r?\n/).map((block) => {
      const line = block.split(/\r?\n/).find((l) => l.includes('-->'));
      if (!line) return null;
      const [a, b] = line.split('-->').map((x) => x.trim());
      const words = block.split(/\r?\n/).slice(block.split(/\r?\n/).indexOf(line) + 1)
        .join(' ').trim();
      return words ? { from: t2s(a), to: t2s(b), words } : null;
    }).filter(Boolean);
  } catch { CUES = []; }
}
const cueAt = (t) => (CUES.find((c) => t >= c.from && t < c.to) || {}).words || '';

function fit() {
  const k = Math.min(innerWidth / 1080, innerHeight / 1920);
  stage.style.transform = 'translate(-50%, -50%) scale(' + k + ')';
}
fit();
addEventListener('resize', fit);

// Counts a number up over a duration, so the score arrives rather than appears.
function countTo(el, from, to, ms) {
  if (!el) return;
  const t0 = performance.now();
  const iv = setInterval(() => {
    const p = Math.min(1, (performance.now() - t0) / ms);
    el.textContent = Math.round(from + (to - from) * (1 - Math.pow(1 - p, 3)));
    if (p >= 1) clearInterval(iv);
  }, 40);
}

const scenes = [...stage.querySelectorAll('.scene')];

// Where each scene begins, in seconds. The voice was cut to these boundaries,
// so they are the same numbers in both files.
const STARTS = SCENES.reduce((acc, s) => {
  acc.push((acc[acc.length - 1] || 0) + s.ms / 1000);
  return acc;
}, []);
const TOTAL = STARTS[STARTS.length - 1];
const sceneAt = (t) => { let i = 0; while (i < STARTS.length - 1 && t >= STARTS[i]) i += 1; return i; };

let shown = -1;
let counted = new Set();
function frame(t) {
  const i = sceneAt(t);
  if (i !== shown) {
    scenes.forEach((s) => s.classList.remove('on'));
    scenes[i].classList.add('on');
    shown = i;
  }
  // The score animations belong to their scene, and must not restart if the
  // clock jitters back a frame.
  if (i === 3 && !counted.has(3)) {
    counted.add(3); countTo(scenes[3].querySelector('#n'), 0, rBefore.score, 1400);
  }
  if (i === 4 && !counted.has(4)) {
    counted.add(4); countTo(scenes[4].querySelector('#n2'), rBefore.score, rAfter.score, 1800);
  }
  const words = cueAt(t);
  if (capEl.textContent !== words) capEl.textContent = words;
}

function finish() {
  scenes.forEach((s) => s.classList.remove('on'));
  capEl.textContent = '';
  shown = -1;
  counted = new Set();
  document.getElementById('go').hidden = false;
}

// The audio is the clock when there is audio. Reading the scene from
// currentTime rather than counting timeouts means the picture cannot drift
// away from the voice, however the browser schedules us.
// setInterval rather than requestAnimationFrame. rAF is suspended entirely
// while a tab is hidden - measured here at zero calls in two seconds against
// twenty from a 100ms interval - so a reel driven by it freezes on the first
// frame the moment the window goes behind something, and the voice carries on
// without the picture. Nothing on screen moves faster than a scene change or
// a caption swap, so 50ms is smoother than it needs to be.
// A browser only lets audio start while the press that asked for it is still
// "transiently active", and that activation is spent by the first await. The
// reel used to await a fullscreen request and a fetch of the cue file before
// ever calling play(), by which point the press was long gone and play() was
// rejected - silently, because the rejection fell into a catch that quietly
// started the silent timeline instead. Everything looked right except that
// there was no voice. So: play first, synchronously, and arrange the rest
// around it.
function playWithVoice() {
  let iv;
  const stop = () => { clearInterval(iv); vo.pause(); finish(); };
  const drive = () => {
    iv = setInterval(() => {
      // Stop on the timeline's own length, not the audio's. A file served
      // without a Content-Length reports duration Infinity and never fires
      // 'ended', which would leave the last scene up for good.
      if (vo.currentTime >= TOTAL) stop();
      else frame(vo.currentTime);
    }, 50);
  };

  // Rewinding an element the browser has not finished opening can throw; it
  // is already at zero in that case.
  try { vo.currentTime = 0; } catch { /* not seekable yet */ }

  const started = vo.play();
  if (!started) { drive(); return; }          // pre-promise browsers
  started.then(drive).catch((err) => {
    // Said out loud rather than swallowed. A reel that silently loses its
    // voice is the hardest kind of broken to notice.
    console.warn('[promo] audio refused, playing silently:', err && err.name);
    playSilently();
  });
  vo.onended = stop;
}

// No audio - blocked, missing, or offline. The reel still has to run, and the
// captions still have to show, because they carry the argument.
function playSilently() {
  const t0 = performance.now();
  const iv = setInterval(() => {
    const t = (performance.now() - t0) / 1000;
    if (t >= TOTAL) { clearInterval(iv); finish(); return; }
    frame(t);
  }, 50);
}

// Fetched at load. Waiting for it on the press would spend the activation the
// audio needs, and the caption layer reads CUES every tick anyway, so a slow
// answer fills itself in rather than being missed.
loadCues();

// ?auto=1 used to mean "silent", which was the wrong shape. It exists so that
// something other than a finger can start the reel - a capture tool pointed at
// this URL, most obviously - and such a tool wants the voice. So it tries the
// audio like any other start and falls back to silence only if the browser
// actually refuses, which is what the fallback was for in the first place.
function play() {
  if (vo && vo.src) playWithVoice();
  else playSilently();
}

const go = document.getElementById('go');
go.addEventListener('click', () => {
  go.hidden = true;
  // Audio first and synchronously, while the press is still active.
  play();
  // Then fullscreen, which on a phone is the difference between a recording
  // of the reel and a recording of the reel with an address bar across the
  // top. iOS Safari refuses it on anything but a <video>, and the reel simply
  // plays inline there.
  const fs = document.documentElement.requestFullscreen;
  if (fs) fs.call(document.documentElement).catch(() => { /* inline */ });
});
if (new URLSearchParams(location.search).get('auto')) { go.hidden = true; play(); }

// Backing out of fullscreen mid-reel leaves a stage nobody asked for, so put
// the play button back and let them start again cleanly.
document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement) go.hidden = false;
});

// Reported so the figures can be checked against the engine without watching.
console.info('[promo] before', rBefore.score, rBefore.letter, rBefore.findings.length + ' findings',
  '| after', rAfter.score, rAfter.letter, rAfter.findings.length + ' findings');
</script>
